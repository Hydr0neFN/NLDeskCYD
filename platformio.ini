; NLDeskCYD -- desk dashboard for the NL studio on an ESP32-2432S028 ("CYD").
;
; Display/touch config is the one proven on this exact board in PCDeskCYD:
; TFT_eSPI with ILI9341_2_DRIVER + TFT_INVERSION_ON (the plain ILI9341 driver
; leaves part of the panel unaddressed), touch on its own VSPI bus.
;
; Data comes from Home Assistant over MQTT (mqtt_statestream), not the HA API.
;
;   pio run -e cyd -t upload            first flash over USB
;   pio run -e cyd_ota -t upload        every flash after that (ArduinoOTA)

[platformio]
default_envs = cyd
extra_configs = secrets.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
; two 1.9 MB app slots -> OTA capable
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D USER_SETUP_LOADED
    -D USE_HSPI_PORT
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; 80 MHz is above the ST7789's 62.5 MHz write spec but halves a full-screen
    ; push (34 -> 19 ms). If the panel ever shows snow or rolling lines, go
    ; back to 40000000 (ESP32 can only do 80 MHz / n).
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; Panel driver: this USB-C "TPM408-2.8" board is an ST7789, not an ILI9341.
; ILI9341_2_DRIVER (what PCDeskCYD used) addresses the full panel but writes
; ILI9341-format gamma tables into the ST7789's E0/E1, which lifts blue/green
; on every dark colour -- invisible on a light theme, obvious on a dark one.
; Measured 2026-09-27 with the colour-check page: ST7789 + inversion OFF +
; BGR order gives correct colours; geometry and touch mapping unchanged.
[driver_st]
build_flags = ${env.build_flags} -D ST7789_DRIVER -D TFT_WIDTH=240 -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
; Old driver, kept for comparison only.
[driver_ili]
build_flags = ${env.build_flags} -D ILI9341_2_DRIVER -D TFT_INVERSION_ON

[env:cyd]
build_flags = ${driver_st.build_flags}
upload_speed = 460800

[env:cyd_ota]
build_flags = ${driver_st.build_flags}
upload_protocol = espota
upload_port = nldeskcyd.local
upload_flags =
    --auth=${secrets.ota_password}

[env:cyd_ili_ota]
build_flags = ${driver_ili.build_flags}
upload_protocol = espota
upload_port = nldeskcyd.local
upload_flags =
    --auth=${secrets.ota_password}
