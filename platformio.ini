; NLDeskCYD -- desk dashboard for the NL studio on an ESP32-2432S028 ("CYD").
;
; Display/touch config is the one proven on this exact board in PCDeskCYD:
; TFT_eSPI with ILI9341_2_DRIVER + TFT_INVERSION_ON (the plain ILI9341 driver
; leaves part of the panel unaddressed), touch on its own VSPI bus.
;
; Data comes from Home Assistant over MQTT (mqtt_statestream), not the HA API.
;
;   pio run -e cyd -t upload            first flash over USB
;   pio run -e cyd_ota -t upload        every flash after that (ArduinoOTA)

[platformio]
default_envs = cyd
extra_configs = secrets.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
; two 1.9 MB app slots -> OTA capable
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D USER_SETUP_LOADED
    -D USE_HSPI_PORT
    -D ILI9341_2_DRIVER
    -D TFT_INVERSION_ON
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:cyd]
upload_speed = 460800

[env:cyd_ota]
upload_protocol = espota
upload_port = nldeskcyd.local
upload_flags =
    --auth=${secrets.ota_password}
